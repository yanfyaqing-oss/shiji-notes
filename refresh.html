<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2ea">
  <title>正在更新拾记</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f2ea;color:#24251f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    main{width:min(360px,calc(100% - 40px));text-align:center}.mark{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 18px;border-radius:17px;background:#24251f;color:#f6f2ea;font:700 25px Georgia,serif}h1{font:700 25px Georgia,"Songti SC",serif;margin:0 0 10px}p{color:#77756c;font-size:14px;line-height:1.7;margin:0}.retry{display:none;margin:20px auto 0;border:0;border-radius:12px;background:#df5a36;color:#fff;padding:12px 18px;font-weight:700}
  </style>
</head>
<body>
  <main><div class="mark">拾</div><h1>正在更新到最新版</h1><p id="message">只清理旧网页缓存，笔记、照片和登录信息都会保留。</p><button id="retry" class="retry" type="button">重新打开拾记</button></main>
  <script>
    async function refreshShiji() {
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith('shiji-')).map(key => caches.delete(key)));
        }
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(item => item.scope.includes('/shiji-notes/')).map(item => item.unregister()));
        }
        location.replace(`./?v=18&refreshed=${Date.now()}`);
      } catch {
        document.getElementById('message').textContent = '自动更新没有完成，请点下面的按钮重新打开。';
        document.getElementById('retry').style.display = 'block';
      }
    }
    document.getElementById('retry').addEventListener('click', refreshShiji);
    refreshShiji();
  </script>
</body>
</html>
