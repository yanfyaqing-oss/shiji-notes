<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2ea">
  <meta name="description" content="轻量的问题与结果笔记工具">
  <title>拾记 · 问题与结果</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="拾记首页">
        <span class="brand-mark">拾</span>
        <span><strong>拾记</strong><small>问题有回声，经验有去处</small></span>
      </a>
      <div class="top-actions">
        <button id="themeBtn" class="icon-btn" type="button" aria-label="切换深色模式" title="切换主题">◐</button>
        <button id="moreBtn" class="icon-btn" type="button" aria-label="数据与设置" title="数据与设置">•••</button>
        <button id="newNoteBtn" class="primary-btn" type="button"><span>＋</span> 新建记录</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow" id="todayText"></p>
        <h1>今天，有什么值得记下？</h1>
        <p>把遇到的问题、思考过程和最终结果放在一起，让每次解决都有迹可循。</p>
        <div class="stats" aria-label="笔记统计">
          <span><b id="totalCount">0</b> 条记录</span>
          <i></i>
          <span><b id="solvedCount">0</b> 个已解决</span>
          <i></i>
          <span><b id="weekCount">0</b> 条本周新增</span>
        </div>
      </section>

      <section class="toolbar" aria-label="搜索和筛选">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索标题、内容或标签…" autocomplete="off">
          <kbd>⌘ K</kbd>
        </label>
        <div class="filter-row" id="statusFilters">
          <button class="filter active" type="button" data-status="all">全部</button>
          <button class="filter" type="button" data-status="open"><span class="dot amber"></span>待解决</button>
          <button class="filter" type="button" data-status="solved"><span class="dot green"></span>已解决</button>
          <button class="filter" type="button" data-status="archived">已归档</button>
        </div>
        <select id="categoryFilter" aria-label="按分类筛选">
          <option value="all">全部分类</option>
        </select>
      </section>

      <section class="notes-section">
        <div class="section-heading">
          <h2 id="listTitle">全部记录</h2>
          <span id="resultCount">0 条</span>
        </div>
        <div id="notesGrid" class="notes-grid"></div>
        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-icon">✦</div>
          <h3>这里还很安静</h3>
          <p id="emptyText">记下第一个问题，让经验开始积累。</p>
          <button id="emptyNewBtn" class="secondary-btn" type="button">写一条记录</button>
        </div>
      </section>
    </main>

    <button id="mobileNewBtn" class="mobile-new" type="button" aria-label="新建记录">＋</button>
  </div>

  <dialog id="noteDialog" class="note-dialog">
    <form id="noteForm" method="dialog">
      <div class="dialog-head">
        <div><p class="eyebrow" id="formEyebrow">新记录</p><h2 id="formTitle">记录问题与结果</h2></div>
        <button class="close-btn" value="cancel" type="button" data-close aria-label="关闭">×</button>
      </div>
      <div class="form-body">
        <label class="field full"><span class="field-label"><span>标题 <em>*</em></span><button class="voice-btn" type="button" data-voice-target="titleInput" aria-label="语音输入标题" title="语音输入">🎙 <span>语音</span></button></span><input id="titleInput" maxlength="80" required placeholder="一句话描述这次记录"></label>
        <div class="form-row">
          <label class="field"><span>分类</span><input id="categoryInput" list="categoryOptions" maxlength="20" placeholder="例如：工作"></label>
          <datalist id="categoryOptions"><option value="学习"><option value="工作"><option value="生活"><option value="灵感"></datalist>
          <label class="field"><span>状态</span><select id="statusInput"><option value="open">待解决</option><option value="solved">已解决</option><option value="archived">已归档</option></select></label>
        </div>
        <label class="field full"><span class="field-label"><span>问题 / 背景</span><button class="voice-btn" type="button" data-voice-target="problemInput" aria-label="语音输入问题和背景" title="语音输入">🎙 <span>语音</span></button></span><textarea id="problemInput" rows="4" placeholder="遇到了什么？当时的背景是什么？"></textarea></label>
        <label class="field full"><span class="field-label"><span>过程 / 思路</span><button class="voice-btn" type="button" data-voice-target="processInput" aria-label="语音输入过程和思路" title="语音输入">🎙 <span>语音</span></button></span><textarea id="processInput" rows="5" placeholder="尝试了什么？有哪些关键发现？"></textarea></label>
        <label class="field full"><span class="field-label"><span>结果 / 结论</span><button class="voice-btn" type="button" data-voice-target="resultInput" aria-label="语音输入结果和结论" title="语音输入">🎙 <span>语音</span></button></span><textarea id="resultInput" rows="4" placeholder="最终如何解决？下次可以怎样做？"></textarea></label>
        <label class="field full"><span>标签 <small>用空格或逗号分隔</small></span><input id="tagsInput" maxlength="100" placeholder="例如：Unity  性能优化"></label>
      </div>
      <div class="dialog-actions">
        <button id="deleteBtn" class="danger-btn" type="button" hidden>删除</button>
        <span class="action-spacer"></span>
        <button class="ghost-btn" type="button" data-close>取消</button>
        <button class="primary-btn" type="submit">保存记录</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="settings-dialog">
    <div class="dialog-head"><div><p class="eyebrow">数据与设置</p><h2>保管你的记录</h2></div><button class="close-btn" type="button" data-settings-close aria-label="关闭">×</button></div>
    <div class="settings-body">
      <div class="setting-item"><div><strong>导出备份</strong><p>下载全部记录，可在另一台设备导入。</p></div><button id="exportBtn" class="secondary-btn" type="button">导出 JSON</button></div>
      <div class="setting-item"><div><strong>导入备份</strong><p>从拾记备份文件恢复或合并记录。</p></div><button id="importBtn" class="secondary-btn" type="button">选择文件</button><input id="importInput" type="file" accept="application/json,.json" hidden></div>
      <div class="setting-item"><div><strong>安装到桌面</strong><p>像普通应用一样打开，并支持离线使用。</p></div><button id="installBtn" class="secondary-btn" type="button" disabled>等待浏览器支持</button></div>
      <p class="storage-note">记录默认只保存在当前浏览器中。请定期导出备份，换设备时先导出再导入。</p>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
